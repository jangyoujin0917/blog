
name: Validate

on:
  push:
    branches: [v5]
  pull_request:
    branches: [v5]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build Quartz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build
